[package]
name = "valorant-bgm-player"
version = "1.0.0"
description = "Valorant BGM Player"
authors = []
license = "MIT"
edition = "2021"

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-store = "2.4"
tauri-plugin-fs = "2.5"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
rodio = { version = "0.17.0", features = ["mp3"] }
cpal = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = "0.8"
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = "0.4"
dirs = "5.0"
rfd = "0.15"
lazy_static = "1.4"
parking_lot = "0.12"
regex = "1.10"
urlencoding = "2.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "valorant-bgm-player"
path = "src/main.rs"
